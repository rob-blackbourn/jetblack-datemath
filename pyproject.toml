[project]
name = "jetblack-datemath"
version = "1.0.1"
description = "Date arithmetic for Python"
authors = [
    { name = "Rob Blackbourn", email = "rob.blackbourn@gmail.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
readme = "README.md"
license = "Apache-2.0"
license-files = [
    "LICENSE"
]
keywords = [
    "asgi",
    "web",
    "framework",
    "asyncio",
    "http",
]

[project.optional-dependencies]
dev = [
    "autopep8",
    "coverage",
    "mypy",
    "pytest",
    "pylint",
]

[project.urls]
Repository = "https://github.com/rob-blackbourn/jetblack-datemath"
Issues = "https://github.com/rob-blackbourn/jetblack-datemath/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# pylint
[tool.pylint.main]
py-version = "3.12"
jobs = 4

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_"]
bad-names = ["foo", "bar", "baz", "toto", "tutu", "tata"]

[tool.pylint."messages control"]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-comparison-to-zero",
    "missing-module-docstring",
]

# pytest
[tool.pytest.ini_options]
testpaths = [ "tests" ]

# mypy
[tool.mypy]
files = [ "src/jetblack_datemath", "tests" ]

[[tool.mypy.overrides]]
module = "pytest"
ignore_missing_imports = true
